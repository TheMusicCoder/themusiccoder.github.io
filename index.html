<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reel Picks">
<meta name="theme-color" content="#0f0d0c">
<title>Reel Picks</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23f2b544'/%3E%3Ctext x='50' y='70' font-size='60' text-anchor='middle'%3E🎬%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0d0c;--panel:#1a1716;--panel2:#24201e;--line:#332d2a;--text:#f3ece4;--muted:#a39a90;--accent:#f2b544;--red:#e2553d;--green:#5cc489;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"DM Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 calc(80px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:var(--accent)}
.wrap{max-width:1100px;margin:0 auto;padding:0 14px}
header{padding:16px 0 6px;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:"DM Serif Display",serif;font-weight:400;font-size:30px;margin:0}
h1 span{color:var(--accent)}
h2{font-family:"DM Serif Display",serif;font-weight:400;font-size:23px;margin:20px 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0 0 12px}
.pill{font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:6px 10px;border-radius:999px;white-space:nowrap}
.pill.on{color:var(--green);border-color:#2d5a40}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(20,17,16,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;max-width:200px;padding:10px 4px 12px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs .ic{font-size:21px;line-height:1}
nav.tabs button.on{color:var(--accent)}
section.view{display:none}section.view.on{display:block}
.btn{background:var(--accent);color:#1a1300;font-weight:700;padding:12px 18px;border-radius:12px;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:disabled{opacity:.5}
.btn.ghost{background:var(--panel);color:var(--text);border:1px solid var(--line);font-weight:500}
.btn.small{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.danger{background:#3a1d18;color:#ffb3a5;border:1px solid #6b2c22}
input[type=text],input[type=search],input[type=password]{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--text);font:inherit;font-size:16px;padding:12px 14px}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
.search{display:flex;gap:8px;position:sticky;top:0;z-index:10;background:var(--bg);padding:10px 0}
.search .btn{padding:12px 16px}

/* poster grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px 12px}
@media (max-width:560px){.grid{grid-template-columns:repeat(3,1fr);gap:12px 9px}}
.tile{position:relative;animation:in .3s ease both}
.tile .pst{aspect-ratio:2/3;border-radius:10px;overflow:hidden;position:relative;background:var(--panel2);display:block;width:100%;padding:0}
.tile .pst img{width:100%;height:100%;object-fit:cover;display:block}
.tile .pst .fb{position:absolute;inset:0;display:flex;align-items:flex-end;padding:10px;font-family:"DM Serif Display",serif;font-size:16px;line-height:1.1;text-align:left}
.tile .ttl{font-size:13px;margin-top:6px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .yr{font-size:12px;color:var(--muted)}
.tile .quick{position:absolute;top:6px;right:6px;display:flex;flex-direction:column;gap:6px;z-index:2}
.tile .quick button{width:32px;height:32px;border-radius:50%;background:rgba(10,8,7,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);font-size:15px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.12)}
.tile .quick button.on{background:var(--accent);color:#1a1300}
.tile .score{position:absolute;left:6px;bottom:6px;z-index:2;font-size:11px;font-weight:700;background:rgba(10,8,7,.75);padding:3px 6px;border-radius:6px}
.tile.gone{animation:out .25s ease forwards}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:scale(.9)}}
.more{text-align:center;margin:18px 0}
.empty,.loading{color:var(--muted);text-align:center;padding:36px 12px;border:1px dashed var(--line);border-radius:var(--r);margin:10px 0}
.loading{border:0;display:flex;gap:10px;justify-content:center;align-items:center}
.spinner{width:18px;height:18px;border:2px solid var(--accent);border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
.seg button{padding:7px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:13px}
.seg button.on{background:var(--accent);color:#1a1300;border-color:var(--accent);font-weight:700}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;opacity:0;pointer-events:none;transition:.2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--panel);border-radius:20px 20px 0 0;z-index:31;transform:translateY(105%);transition:transform .25s ease;padding:10px 18px calc(22px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto;border:1px solid var(--line)}
.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet .top{display:grid;grid-template-columns:120px 1fr;gap:16px}
.sheet .top img,.sheet .top .ph{width:120px;aspect-ratio:2/3;border-radius:10px;object-fit:cover;background:var(--panel2)}
.sheet h3{font-family:"DM Serif Display",serif;font-weight:400;font-size:25px;margin:0 0 4px;line-height:1.1}
.sheet .meta{color:var(--muted);font-size:13px;margin-bottom:8px}
.sheet .ov{font-size:15px;line-height:1.5;margin:14px 0}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.acts button{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 8px;font-size:14px}
.acts button.on{border-color:var(--accent);color:var(--accent)}
.links{margin-top:14px;font-size:13px;display:flex;gap:16px;flex-wrap:wrap}

.fbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:2px 0 12px}
.fbar .chip{font-size:12px;padding:6px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}
.fbtn{padding:8px 13px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:14px}
.fbtn.on{border-color:var(--accent);color:var(--accent)}
.fpanel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 14px;margin:0 0 14px;display:none}
.fpanel.on{display:block}
.fpanel h4{margin:12px 0 6px;font-size:13px;color:var(--muted);font-weight:500}
.fpanel h4:first-child{margin-top:2px}
.fpanel .seg{margin:0}
.hero{display:grid;grid-template-columns:110px 1fr;gap:14px;background:var(--panel);border:1px solid var(--accent);border-radius:var(--r);padding:12px;margin:6px 0 16px}
.hero img,.hero .ph{width:110px;aspect-ratio:2/3;border-radius:10px;object-fit:cover;background:var(--panel2)}
.hero h3{font-family:"DM Serif Display",serif;font-weight:400;font-size:22px;margin:0 0 4px;line-height:1.1}
.hero .meta{color:var(--muted);font-size:13px;margin-bottom:6px}
.hero .ov{font-size:13.5px;line-height:1.4;margin:0 0 10px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.card label{display:block;font-size:13px;color:var(--muted);margin:10px 0 6px}
.code{font-family:ui-monospace,Menlo,monospace;font-size:30px;letter-spacing:4px;color:var(--accent);text-align:center;margin:12px 0;user-select:all}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:40;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.note{font-size:12px;color:var(--muted);margin-top:28px;text-align:center}
.banner{background:radial-gradient(120% 140% at 0% 0%,#3a2a14 0%,var(--panel) 60%);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:6px 0 4px;font-size:14px}
.banner b{display:block;font-family:"DM Serif Display",serif;font-weight:400;font-size:19px;margin-bottom:4px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Reel<span>.</span>Picks</h1>
    <button class="pill" id="acct">Not connected</button>
  </header>

  <!-- FOR YOU -->
  <section class="view on" id="v-foryou">
    <div id="fyBanner"></div>
    <h2>For you</h2>
    <p class="sub" id="fySub">Loading…</p>
    <div class="fbar" id="fbar"></div>
    <div class="fpanel" id="fpanel"></div>
    <div id="fyGrid"></div>
    <div class="more"><button class="btn ghost" id="fyMore" style="display:none">Show more</button></div>
  </section>

  <!-- SEARCH -->
  <section class="view" id="v-search">
    <form class="search" id="searchForm">
      <input type="search" id="q" placeholder="Search a movie…" autocomplete="off" enterkeyhint="search">
      <button class="btn" type="submit">Search</button>
    </form>
    <div id="searchOut"><p class="sub">Search any movie, then tap it to see related movies.</p></div>
  </section>

  <!-- WATCHLIST -->
  <section class="view" id="v-list">
    <h2 id="libTitle">Watchlist</h2>
    <div class="seg" id="libSeg"><button data-lib="wl" class="on">🔖 Watchlist</button><button data-lib="liked">👍 Liked</button></div>
    <p class="sub" id="wlSub"></p>
    <div id="wlGrid"></div>
  </section>

  <!-- SETTINGS -->
  <section class="view" id="v-settings">
    <h2>Settings</h2>
    <div class="card" id="traktCard"></div>
    <div class="card">
      <b>Keys</b>
      <label for="tmdbKey">TMDB API Read Access Token (for posters &amp; search)</label>
      <input type="password" id="tmdbKey" placeholder="Built in — leave blank" autocomplete="off">
      <label for="traktId">Trakt Client ID</label>
      <input type="text" id="traktId" autocomplete="off" spellcheck="false">
      <div class="row" style="margin-top:12px"><button class="btn small" id="saveKeys">Save</button><span class="sub" id="keyStatus" style="margin:0"></span></div>
    </div>
    <p class="note">This product uses the TMDB API but is not endorsed or certified by TMDB. Watch data from Trakt.</p>
  </section>
</div>

<nav class="tabs">
  <button class="on" data-v="foryou"><span class="ic">✨</span>For You</button>
  <button data-v="search"><span class="ic">🔎</span>Search</button>
  <button data-v="list"><span class="ic">🔖</span>My Movies</button>
  <button data-v="settings"><span class="ic">⚙️</span>Settings</button>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
/* ================= config & storage ================= */
const DEFAULT_TMDB="eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiJjNzk5YWZlNjUzZGYwMWUxOTM1YmEyYTJiYTYyZGM4YSIsIm5iZiI6MTc3Mjg5NTI1NC42MzM5OTk4LCJzdWIiOiI2OWFjM2MxNjQ4OWM3YmRhNzNhYTg3Y2IiLCJzY29wZXMiOlsiYXBpX3JlYWQiXSwidmVyc2lvbiI6MX0.rVxZ7Fr3hm-mHE-fCoQyY4yEwlfZqM3BxpbojbMH-7s";
const DEFAULT_TRAKT_ID="pgv8DAxvFKRMVtevG6bHIH3S8vYZ4iNssPZlQ_Fz6kM";
const TRAKT_API="https://api.trakt.tv", TRAKT_WEB="https://trakt.tv", TMDB_API="https://api.themoviedb.org/3", IMG="https://image.tmdb.org/t/p/";
const REDIRECT="http://localhost";
const ls={get(k,d){try{const v=localStorage.getItem("rp_"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("rp_"+k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem("rp_"+k)}catch(e){}}};
const cfg={get tmdb(){return ls.get("tmdb","")||DEFAULT_TMDB},get traktId(){return ls.get("traktId",DEFAULT_TRAKT_ID)}};
// one-tap sign-in link: #signin=<base64url json>
(()=>{const m=location.hash.match(/^#signin=([A-Za-z0-9_-]+)$/);if(!m)return;
  try{const j=JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,"+").replace(/_/g,"/")))));if(j.t&&j.t.access_token){ls.set("token",j.t);if(j.u)ls.set("user",j.u);sessionStorage.setItem("rp_linked","1")}}catch(e){}
  history.replaceState(null,"",location.pathname)})();
let token=ls.get("token",null);           // {access_token,refresh_token,expires_at}
let meta=ls.get("meta",{});               // tmdbId -> {poster,overview,runtime,vote,genres,title,year}
// user sets keyed by tmdb id (string)
const U={ratedMovies:new Map(),watched:new Set(),rated:new Map(),watchlist:new Map(),hidden:new Set(ls.get("hidden",[]))};
const local=ls.get("local",{watchlist:{},rated:{}}); // used when not connected

function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2000)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function hue(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h}
function fbBg(t){const h=hue(t),a=h%360,b=(a+50)%360;return `linear-gradient(160deg,hsl(${a} 50% 30%),hsl(${b} 55% 14%))`}
let metaSaveT=null;function saveMeta(){clearTimeout(metaSaveT);metaSaveT=setTimeout(()=>{const keys=Object.keys(meta);if(keys.length>1500)keys.slice(0,keys.length-1500).forEach(k=>delete meta[k]);ls.set("meta",meta)},800)}

/* ================= filters ================= */
const GEN=[["action","Action",28],["adventure","Adventure",12],["animation","Animation",16],["comedy","Comedy",35],["crime","Crime",80],["documentary","Documentary",99],["drama","Drama",18],["family","Family",10751],["fantasy","Fantasy",14],["history","History",36],["horror","Horror",27],["music","Music",10402],["mystery","Mystery",9648],["romance","Romance",10749],["science-fiction","Sci-Fi",878],["thriller","Thriller",53],["war","War",10752],["western","Western",37]];
const GBYID=Object.fromEntries(GEN.map(g=>[g[2],g[0]]));
const GBYNAME={"science fiction":"science-fiction","sci-fi":"science-fiction","sci-fi & fantasy":"science-fiction"};GEN.forEach(g=>{GBYNAME[g[1].toLowerCase()]=g[0];GBYNAME[g[0]]=g[0]});
const DECADES=[["2020s",2020,2029],["2010s",2010,2019],["2000s",2000,2009],["1990s",1990,1999],["1980s",1980,1989],["Older",1900,1979]];
const RATINGS=[["Any",0],["6+",6],["7+",7],["8+",8]];
const LENGTHS=[["Any",""],["Under 90 min","lt90"],["Under 2 hrs","lt120"],["2 hrs+","ge120"]];
let F=ls.get("filters",{g:[],d:[],r:0,len:""});
const fActive=()=>F.g.length||F.d.length||F.r||F.len;
function gKeys(m){const x=meta[m.id]||{};const src=m.gids?m.gids.map(i=>GBYID[i]):(m.genres||x.genres||[]).map(n=>GBYNAME[String(n).toLowerCase()]);return src.filter(Boolean)}
function passes(m){
  if(!fActive())return true;
  const x=meta[m.id]||{};
  if(F.g.length){const gs=gKeys(m);if(gs.length&&!F.g.some(g=>gs.includes(g)))return false;if(!gs.length)return false}
  if(F.d.length){const y=Number(m.year||x.year);if(!y||!F.d.some(k=>{const d=DECADES.find(z=>z[0]===k);return y>=d[1]&&y<=d[2]}))return false}
  if(F.r){const v=m.vote||x.vote;if(!v||v<F.r)return false}
  if(F.len){const rt=m.runtime||x.runtime;if(rt){if(F.len==="lt90"&&rt>=90)return false;if(F.len==="lt120"&&rt>=120)return false;if(F.len==="ge120"&&rt<120)return false}}
  return true;
}
function renderFilters(){
  const n=F.g.length+F.d.length+(F.r?1:0)+(F.len?1:0);
  const chips=[...F.g.map(k=>GEN.find(g=>g[0]===k)[1]),...F.d,...(F.r?[F.r+"+ ★"]:[]),...(F.len?[LENGTHS.find(l=>l[1]===F.len)[0]]:[])];
  document.getElementById("fbar").innerHTML=`<button class="fbtn ${n?"on":""}" id="ftoggle">⚙︎ Filters${n?` (${n})`:""}</button>${chips.map(c=>`<span class="chip">${esc(c)}</span>`).join("")}${n?`<button class="fbtn" id="fclear">Clear</button>`:""}`;
  const seg=(name,opts,isOn)=>`<div class="seg">${opts.map(([l,v])=>`<button data-f="${name}" data-val="${v}" class="${isOn(v)?"on":""}">${l}</button>`).join("")}</div>`;
  document.getElementById("fpanel").innerHTML=`<h4>Genres (any of)</h4>${seg("g",GEN.map(g=>[g[1],g[0]]),v=>F.g.includes(v))}
    <h4>Decade</h4>${seg("d",DECADES.map(d=>[d[0],d[0]]),v=>F.d.includes(v))}
    <h4>Rating</h4>${seg("r",RATINGS,v=>Number(v)===F.r)}
    <h4>Length</h4>${seg("len",LENGTHS,v=>v===F.len)}
    <div class="row" style="margin-top:14px"><button class="btn small" id="fdone">Show results</button></div>`;
}
let fTimer=null;
function setFilter(name,val){
  if(name==="g"||name==="d"){const a=F[name];F[name]=a.includes(val)?a.filter(x=>x!==val):[...a,val]}
  else if(name==="r")F.r=Number(val);else F.len=val;
  ls.set("filters",F);renderFilters();document.getElementById("fpanel").classList.add("on");
  clearTimeout(fTimer);fTimer=setTimeout(()=>applyFilters(),500);
}
function applyFilters(){disc={list:[],page:0,done:false,sig:""};showMoreFY(true)}
// TMDB discover top-up that matches filters
let disc={list:[],page:0,done:false,sig:""};
async function discoverMore(){
  if(!cfg.tmdb||disc.done)return;
  const sig=JSON.stringify(F);if(disc.sig!==sig)disc={list:[],page:0,done:false,sig};
  const p={sort_by:"popularity.desc","vote_count.gte":"150",include_adult:"false",page:String(disc.page+1)};
  if(F.g.length)p.with_genres=F.g.map(k=>GEN.find(g=>g[0]===k)[2]).join("|");
  if(F.d.length){const ds=F.d.map(k=>DECADES.find(z=>z[0]===k));p["primary_release_date.gte"]=Math.min(...ds.map(d=>d[1]))+"-01-01";p["primary_release_date.lte"]=Math.max(...ds.map(d=>d[2]))+"-12-31"}
  if(F.r)p["vote_average.gte"]=String(F.r);
  if(F.len==="lt90")p["with_runtime.lte"]="89";if(F.len==="lt120")p["with_runtime.lte"]="119";if(F.len==="ge120")p["with_runtime.gte"]="120";
  if(!p["primary_release_date.lte"])p["primary_release_date.lte"]=new Date().toISOString().slice(0,10);
  const d=await tmdb("/discover/movie",p);disc.page++;if(disc.page>=(d.total_pages||1))disc.done=true;
  disc.list=disc.list.concat((d.results||[]).map(fromTmdb).filter(Boolean));
}

/* ================= movie model ================= */
// m = {id (tmdb string), tmdb, trakt, slug, imdb, title, year, overview, runtime, vote, genres, poster}
function fromTrakt(t){if(!t)return null;const ids=t.ids||{};const id=ids.tmdb?String(ids.tmdb):null;if(!id)return null;
  const m={id,tmdb:ids.tmdb,trakt:ids.trakt,slug:ids.slug,imdb:ids.imdb,title:t.title,year:t.year,overview:t.overview,runtime:t.runtime,vote:t.rating?Math.round(t.rating*10)/10:null,genres:t.genres};
  return mergeMeta(m)}
function fromTmdb(t){if(!t||!t.id)return null;const id=String(t.id);
  const m={id,tmdb:t.id,title:t.title||t.name,year:(t.release_date||"").slice(0,4)||null,overview:t.overview,vote:t.vote_average?Math.round(t.vote_average*10)/10:null,poster:t.poster_path||null,votes:t.vote_count,gids:t.genre_ids};
  if(m.poster)meta[id]={...(meta[id]||{}),poster:m.poster};
  return mergeMeta(m)}
function mergeMeta(m){const x=meta[m.id];if(x){for(const k in x)if(m[k]==null||m[k]==="")m[k]=x[k]}return m}
function isHandled(id){return U.watched.has(id)||U.rated.has(id)||U.watchlist.has(id)||U.hidden.has(id)}

/* ================= HTTP ================= */
async function tmdb(path,params={}){
  if(!cfg.tmdb)throw new Error("no_tmdb");
  const u=new URL(TMDB_API+path);for(const[k,v]of Object.entries(params))u.searchParams.set(k,v);
  const r=await fetch(u,{headers:{Authorization:"Bearer "+cfg.tmdb,accept:"application/json"}});
  if(!r.ok)throw new Error("tmdb_"+r.status);return r.json();
}
async function trakt(path,{method="GET",body,auth=true}={}){
  if(auth&&token&&token.expires_at&&Date.now()>token.expires_at-3600e3)await refreshToken().catch(()=>{});
  const h={"Content-Type":"application/json","trakt-api-version":"2","trakt-api-key":cfg.traktId};
  if(auth&&token)h.Authorization="Bearer "+token.access_token;
  let r=await fetch(TRAKT_API+path,{method,headers:h,body:body?JSON.stringify(body):undefined});
  if(r.status===401&&auth&&token){if(await refreshToken().catch(()=>false)){h.Authorization="Bearer "+token.access_token;r=await fetch(TRAKT_API+path,{method,headers:h,body:body?JSON.stringify(body):undefined})}}
  if(r.status===401&&auth){signOut(true);throw new Error("trakt_401")}
  if(!r.ok)throw new Error("trakt_"+r.status);
  if(r.status===204)return null;const txt=await r.text();return txt?JSON.parse(txt):null;
}

/* ================= poster/meta enrichment ================= */
const pending=new Set();let queue=[],active=0;
function needMeta(m){return cfg.tmdb&&m&&!meta[m.id]?.poster&&!meta[m.id]?.none&&!pending.has(m.id)}
function enrich(list){list.forEach(m=>{if(needMeta(m)){pending.add(m.id);queue.push(m.id)}});pump()}
function pump(){while(active<6&&queue.length){const id=queue.shift();active++;
  tmdb("/movie/"+id).then(d=>{meta[id]={poster:d.poster_path||null,none:!d.poster_path,overview:d.overview,runtime:d.runtime,vote:d.vote_average?Math.round(d.vote_average*10)/10:null,genres:(d.genres||[]).map(g=>g.name),title:d.title,year:(d.release_date||"").slice(0,4)};saveMeta();paintPoster(id)})
  .catch(()=>{}).finally(()=>{active--;pending.delete(id);pump()})}}
function paintPoster(id){const p=meta[id]?.poster;if(!p)return;document.querySelectorAll(`.tile[data-id="${id}"] .pst`).forEach(el=>{if(!el.querySelector("img"))el.querySelector('.fb')?.remove();el.insertAdjacentHTML('afterbegin',`<img src="${IMG}w342${p}" alt="" loading="lazy">`)})}

async function tmdbFromFavorites(){

  }else if(a==="seen"){

/* ================= Trakt sign-in (PKCE) ================= */
function b64url(buf){return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function randStr(n=64){const a=new Uint8Array(n);crypto.getRandomValues(a);return b64url(a).slice(0,n)}
async function challenge(v){return b64url(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(v)))}
function saveToken(t){token={access_token:t.access_token,refresh_token:t.refresh_token,expires_at:(t.created_at?t.created_at*1000:Date.now())+(t.expires_in||86400)*1000};ls.set("token",token)}
async function refreshToken(){
  if(!token?.refresh_token)return false;
  const r=await fetch(TRAKT_API+"/oauth/token",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({refresh_token:token.refresh_token,client_id:cfg.traktId,redirect_uri:REDIRECT,grant_type:"refresh_token"})});
  if(!r.ok)return false;saveToken(await r.json());return true;
}

    if(!r.ok)throw new Error("device_"+r.status);
    const d=await r.json();
    card.innerHTML=`<b>Connect Trakt</b><p class="sub" style="margin-top:6px">1. Copy this code &nbsp; 2. Open Trakt and enter it &nbsp; 3. Come back here — it connects automatically.</p>

      <div class="row" style="justify-content:center"><button class="btn small ghost" id="copyCode">Copy code</button><a class="btn small" href="${esc(d.verification_url||"https://trakt.tv/activate")}" target="_blank" rel="noopener">Open trakt.tv/activate ↗</a></div>
      <p class="sub" id="devStatus" style="text-align:center;margin-top:12px">Waiting for you to approve…</p>
      <p class="sub" style="text-align:center"><button class="btn small ghost" id="altSign">Not working? Sign in another way</button></p>`;
    let interval=(d.interval||5)*1000;const until=Date.now()+(d.expires_in||600)*1000;
    clearTimeout(devicePoll);
    const poll=async()=>{
      if(Date.now()>until){document.getElementById("devStatus").textContent="Code expired. Tap Connect again.";return}
      try{
        const t=await fetch(TRAKT_API+"/oauth/device/token",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:d.device_code,client_id:cfg.traktId,code_verifier:verifier})});
        if(t.status===200){saveToken(await t.json());ls.del("pkce");await onSignedIn();return}
        if(t.status===429)interval+=2000;
        if([404,409,410,418].includes(t.status)){const s=document.getElementById("devStatus");if(s)s.textContent=t.status===418?"Request was denied.":t.status===410?"Code expired. Tap Connect again.":"That didn’t work — try “Sign in another way”.";return}
      }catch(e){}
      devicePoll=setTimeout(poll,interval);
    };
    devicePoll=setTimeout(poll,interval);
  }catch(e){toast("Device sign-in unavailable — using the other method");startRedirect()}
}
async function startRedirect(){
  clearTimeout(devicePoll);
  const verifier=randStr(64),state=randStr(16);ls.set("pkce",verifier);ls.set("pkceState",state);
  const u=new URL(TRAKT_WEB+"/oauth/authorize");
  Object.entries({response_type:"code",client_id:cfg.traktId,redirect_uri:REDIRECT,state,code_challenge:await challenge(verifier),code_challenge_method:"S256"}).forEach(([k,v])=>u.searchParams.set(k,v));
  document.getElementById("traktCard").innerHTML=`<b>Sign in another way</b>
   <p class="sub" style="margin-top:6px">1. Tap <b>Open Trakt</b> and approve.<br>2. Trakt will send you to a page that <b>won’t load</b> (localhost) — that’s expected.<br>3. Copy the full address from that page’s address bar and paste it below.</p>
   <a class="btn small" href="${u}" target="_blank" rel="noopener">Open Trakt ↗</a>
   <label for="pasteUrl">Paste the address here</label><input type="text" id="pasteUrl" placeholder="http://localhost/?code=…">
   <div class="row" style="margin-top:10px"><button class="btn small" id="finishPaste">Finish connecting</button><button class="btn small ghost" id="backDevice">Back</button></div>`;
}
async function finishPaste(){
  const v=document.getElementById("pasteUrl").value.trim();let code=v,state=null;
  try{const u=new URL(v);code=u.searchParams.get("code");state=u.searchParams.get("state")}catch(e){}
  if(!code){toast("Couldn’t find a code in that address");return}
  if(state&&state!==ls.get("pkceState")){toast("That link is from an older attempt — try again");return}
  const r=await fetch(TRAKT_API+"/oauth/token",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code,client_id:cfg.traktId,redirect_uri:REDIRECT,grant_type:"authorization_code",code_verifier:ls.get("pkce")})});
  if(!r.ok){toast("Trakt rejected that code ("+r.status+") — try again");return}
  saveToken(await r.json());ls.del("pkce");ls.del("pkceState");await onSignedIn();
}
async function onSignedIn(){
  toast("Connected to Trakt ✓");
  // move any device-only watchlist/ratings into Trakt
  const wl=[...U.watchlist.values()],rated=[...U.rated.entries()];
  try{
    if(wl.length)await trakt("/sync/watchlist",{method:"POST",body:{movies:wl.map(idsOf)}});
    if(rated.length)await trakt("/sync/ratings",{method:"POST",body:{movies:rated.map(([id,rating])=>({ids:{tmdb:Number(id)},rating}))}});
    ls.del("local");
  }catch(e){}
  await boot();switchTab("foryou");
}
function signOut(expired){
  token=null;ls.del("token");if(expired)toast("Trakt sign-in expired — please connect again");
  loadLocalSets();renderAcct();renderTraktCard();
}
let traktUser=ls.get("user",null);
async function renderAcct(){
  const b=document.getElementById("acct");
  if(token){b.classList.add("on");b.textContent=traktUser?("● "+traktUser):"● Trakt";
    if(!traktUser){try{const s=await trakt("/users/settings");traktUser=s?.user?.username||null;ls.set("user",traktUser);b.textContent="● "+(traktUser||"Trakt")}catch(e){}}}
  else{b.classList.remove("on");b.textContent="Connect Trakt";traktUser=null;ls.del("user")}
}
function renderTraktCard(){
  document.getElementById("traktCard").innerHTML=token
   ?`<b>Trakt</b><p class="sub" style="margin-top:6px">Connected${traktUser?" as <b>"+esc(traktUser)+"</b>":""}. Your watchlist, ratings and watched history sync both ways.</p><div class="row"><button class="btn small ghost" id="resync">↻ Sync now</button><button class="btn small danger" id="signout">Disconnect</button></div>
     <div style="border-top:1px solid var(--line);margin-top:14px;padding-top:12px"><b>Sign in on another device</b><p class="sub" style="margin-top:6px">Makes a link that signs your iPad or another phone in with one tap. Send it to yourself only. Treat it like a password.</p><button class="btn small" id="mkLink">Copy sign-in link</button> <span class="sub" id="linkStatus"></span></div>`
   :`<b>Trakt</b><p class="sub" style="margin-top:6px">Connect your Trakt account so recommendations skip what you’ve watched and your watchlist stays in sync.</p><button class="btn" id="connect">Connect Trakt</button>`;
}

/* ================= navigation & events ================= */
function switchTab(v){
  document.querySelectorAll("nav.tabs button").forEach(x=>x.classList.toggle("on",x.dataset.v===v));
  document.querySelectorAll("section.view").forEach(s=>s.classList.toggle("on",s.id==="v-"+v));
  window.scrollTo(0,0);
  if(v==="list")renderWatchlist();
  if(v==="foryou"&&lists.fy.some(m=>isHandled(m.id)))showMoreFY(true);
  if(v==="settings"){document.getElementById("tmdbKey").value=ls.get("tmdb","");document.getElementById("traktId").value=cfg.traktId;renderTraktCard()}
}
document.querySelector("nav.tabs").addEventListener("click",e=>{const b=e.target.closest("[data-v]");if(b)switchTab(b.dataset.v)});
document.getElementById("acct").addEventListener("click",()=>switchTab("settings"));
document.getElementById("scrim").addEventListener("click",closeSheet);
document.getElementById("fyMore").addEventListener("click",()=>showMoreFY(false));
document.getElementById("searchForm").addEventListener("submit",e=>{e.preventDefault();const i=document.getElementById("q");i.blur();doSearch(i.value)});
document.body.addEventListener("click",e=>{
  const go=e.target.closest("[data-go]");if(go){switchTab(go.dataset.go);return}
  const q=e.target.closest("[data-q]");if(q){e.stopPropagation();act(q.dataset.q,findMovie(q.dataset.id,q.dataset.src));return}
  const o=e.target.closest("[data-open]");if(o){const m=findMovie(o.dataset.open,o.dataset.src);if(o.dataset.src==="search")showRelatedOrOpen(m);else openSheet(m);return}
  const a=e.target.closest("#sheet [data-a]");if(a){act(a.dataset.a,sheetMovie);return}
  const lb=e.target.closest("[data-lib]");if(lb){libView=lb.dataset.lib;renderWatchlist();return}
  const fb=e.target.closest("[data-f]");if(fb){setFilter(fb.dataset.f,fb.dataset.val);return}
  const id=e.target.id;
  if(id==="ftoggle"){document.getElementById("fpanel").classList.toggle("on");return}
  if(id==="fdone"){document.getElementById("fpanel").classList.remove("on");clearTimeout(fTimer);applyFilters();return}
  if(id==="fclear"){F={g:[],d:[],r:0,len:""};ls.set("filters",F);renderFilters();applyFilters();return}
  if(id==="connect")startDevice();
  else if(id==="altSign")startRedirect();
  else if(id==="backDevice")startDevice();
  else if(id==="finishPaste")finishPaste();
  else if(id==="copyCode"){navigator.clipboard?.writeText(document.getElementById("ucode").textContent).then(()=>toast("Code copied")).catch(()=>toast("Long-press the code to copy"))}
  else if(id==="mkLink"){
    const b=btoa(unescape(encodeURIComponent(JSON.stringify({t:token,u:traktUser})))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
    const url=location.origin+location.pathname+"#signin="+b;
    const done=()=>{document.getElementById("linkStatus").textContent="Copied. Paste it into Notes or Messages to yourself, then open it on the other device in Safari.";toast("Sign-in link copied")};
    if(navigator.share){navigator.share({title:"Reel Picks sign-in",url}).then(done).catch(()=>navigator.clipboard?.writeText(url).then(done))}
    else navigator.clipboard?.writeText(url).then(done).catch(()=>prompt("Copy this link:",url));
  }
  else if(id==="signout"){signOut();loadForYou()}
  else if(id==="resync"){boot().then(()=>toast("Synced ✓"))}
  else if(id==="backToResults"){if(searchQ)doSearch(searchQ,false);else document.getElementById("searchOut").innerHTML=""}
  else if(id==="saveKeys"){ls.set("tmdb",document.getElementById("tmdbKey").value.trim());ls.set("traktId",document.getElementById("traktId").value.trim()||DEFAULT_TRAKT_ID);testKeys()}
});
function showRelatedOrOpen(m){openSheet(m)}
async function testKeys(){
  const s=document.getElementById("keyStatus");s.textContent="Checking…";
  let ok=[];
  try{await tmdb("/configuration");ok.push("TMDB ✓")}catch(e){ok.push("TMDB ✗")}
  try{await trakt("/movies/trending?limit=1",{auth:false});ok.push("Trakt ✓")}catch(e){ok.push("Trakt ✗")}
  s.textContent=ok.join("  ");if(ok.every(x=>x.endsWith("✓")))loadForYou();
}
// swipe-down to close sheet
(()=>{const sh=document.getElementById("sheet");let y0=null;sh.addEventListener("touchstart",e=>{if(sh.scrollTop<=0)y0=e.touches[0].clientY},{passive:true});sh.addEventListener("touchend",e=>{if(y0!=null&&e.changedTouches[0].clientY-y0>80)closeSheet();y0=null},{passive:true})})();
// refresh when returning to the app
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&token&&Date.now()-lastBoot>10*60e3)boot()});

/* ================= boot ================= */
let lastBoot=0;
async function boot(){
  lastBoot=Date.now();renderAcct();
  if(token){try{await loadTraktSets()}catch(e){}}else loadLocalSets();
  await loadForYou();
  if(document.getElementById("v-list").classList.contains("on"))renderWatchlist();
}
boot();
if(sessionStorage.getItem("rp_linked")){sessionStorage.removeItem("rp_linked");setTimeout(()=>toast("Signed in with your link ✓"),600)}
if(!token)setTimeout(()=>{if(!token)switchTab("settings")},300);
</script>
